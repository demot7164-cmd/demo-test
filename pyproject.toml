[project]
name = "docx-translation-workflow"
version = "0.1.0"
description = "Mistral Workflow for DOCX translation preserving formatting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]",
    "python-docx>=1.1.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
