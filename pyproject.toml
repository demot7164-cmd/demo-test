[project]
name = "docx-translation-workflow"
version = "0.1.0"
description = "Mistral Workflow for DOCX translation with real Mistral API calls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]",
    "python-docx>=1.1.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "lxml>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
